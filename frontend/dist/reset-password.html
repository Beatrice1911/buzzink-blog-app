<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/Images/title-logo_optimized_.png"
      type="image/png"
    />
    <title>Reset Password - BuzzInk</title>
    <script type="module" crossorigin src="/assets/app-B0iNF3PS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-r6y0_ESY.css">
  </head>

  <body>
    <section class="auth-section">
      <div class="auth-container">
        <h2>Reset Password</h2>
        <p>Enter your new password below to reset your account.</p>

        <form id="resetPasswordForm">
          <div class="password-field">
            <input
              type="password"
              id="newPassword"
              placeholder="New Password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-target="newPassword"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <small class="password-hint">
            Password must include 8+ characters, uppercase, lowercase, number,
            and special character.
          </small>
          <div class="password-strength">
            <div class="strength-bar"></div>
          </div>
          <small id="strengthText"></small>
          <div class="password-field">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <button type="submit" class="btn">Reset Password</button>
        </form>

        <p class="back-login">
          Remembered your password? <a href="index.html">Login</a>
        </p>
      </div>
    </section>

    <div
      id="toast-container"
      style="position: fixed; top: 20px; right: 20px; z-index: 9999"
    ></div>

  </body>
</html>
